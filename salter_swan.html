<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Diagrama Salter-Swan</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 20px auto; padding: 20px; background: #f4f6f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #2980b9; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .control-group { background: #ebf5fb; padding: 15px; border-radius: 5px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type=range] { width: 100%; }
        .policy-box { background: #f9e79f; padding: 15px; border-radius: 5px; margin-bottom: 20px; text-align: center; }
        .zone-title { font-weight: bold; font-size: 1.2em; color: #d35400; }
        canvas { max-height: 400px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Diagrama Salter-Swan</h2>
    <p>Equilibrio Interno (IB) y Externo (EB) usando Gasto (A) y Tipo de Cambio Real (q).</p>
    
    <div class="controls">
        <div class="control-group">
            <label>Gasto de Absorción (A): <span id="val-A">100</span></label>
            <input type="range" id="A" min="80" max="120" value="100" oninput="calc()">
        </div>
        <div class="control-group">
            <label>TCR (q): <span id="val-q">1.00</span></label>
            <input type="range" id="q" min="0.5" max="1.5" step="0.05" value="1.0" oninput="calc()">
        </div>
    </div>

    <div class="policy-box">
        <div>Zona Actual: <span id="zone-name" class="zone-title">Equilibrio Perfecto</span></div>
        <div style="margin-top:5px">Política Recomendada: <span id="policy-rec">Ninguna</span></div>
    </div>

    <canvas id="chartSS"></canvas>
</div>

<script>
    let chart;

    function initChart() {
        const ctx = document.getElementById('chartSS').getContext('2d');
        chart = new Chart(ctx, {
            type: 'scatter',
            data: { datasets: [] },
            options: {
                responsive: true,
                scales: {
                    x: { title: {display: true, text: 'Gasto Absorción (A)'}, min: 80, max: 120 },
                    y: { title: {display: true, text: 'TCR (q)'}, min: 0.5, max: 1.5 }
                }
            }
        });
    }

    function calc() {
        const A = parseFloat(document.getElementById('A').value);
        const q = parseFloat(document.getElementById('q').value);

        document.getElementById('val-A').innerText = A;
        document.getElementById('val-q').innerText = q.toFixed(2);

        // Ecuaciones de las curvas (Pendiente opuesta)
        // IB: q = 1.0 - 0.01*(A - 100)
        // EB: q = 1.0 + 0.01*(A - 100)
        const q_ib = 1.0 - 0.01 * (A - 100);
        const q_eb = 1.0 + 0.01 * (A - 100);

        // Determinar Zona
        let zone = "Equilibrio Perfecto";
        let policy = "Mantener política actual";

        if (q > q_ib && q > q_eb) {
            zone = "Recesión + Superávit";
            policy = "↑ Gasto (A) y ↓ TCR (q)";
        } else if (q > q_ib && q < q_eb) {
            zone = "Recesión + Déficit";
            policy = "↓ Gasto (A) y ↓ TCR (q)"; // Devaluación competitiva
        } else if (q < q_ib && q > q_eb) {
            zone = "Inflación + Superávit";
            policy = "↑ Gasto (A) y ↑ TCR (q)"; // Apreciación
        } else if (q < q_ib && q < q_eb) {
            zone = "Inflación + Déficit";
            policy = "↓ Gasto (A) y ↑ TCR (q)";
        }

        // Caso especial: Cerca del centro
        if (Math.abs(A-100) < 2 && Math.abs(q-1) < 0.05) {
            zone = "Equilibrio Perfecto";
            policy = "Ninguna";
        }

        document.getElementById('zone-name').innerText = zone;
        document.getElementById('policy-rec').innerText = policy;

        // Datos para las líneas
        const dataIB = [{x: 80, y: 1.0 - 0.01*(80-100)}, {x: 120, y: 1.0 - 0.01*(120-100)}];
        const dataEB = [{x: 80, y: 1.0 + 0.01*(80-100)}, {x: 120, y: 1.0 + 0.01*(120-100)}];
        const currentPoint = [{x: A, y: q}];

        chart.data.datasets = [
            {
                label: 'IB (Pleno Empleo)',
                data: dataIB,
                showLine: true,
                borderColor: '#e74c3c',
                borderWidth: 2
            },
            {
                label: 'EB (Balanza Pagos)',
                data: dataEB,
                showLine: true,
                borderColor: '#3498db',
                borderWidth: 2
            },
            {
                label: 'Economía Actual',
                data: currentPoint,
                backgroundColor: '#2ecc71',
                pointRadius: 8
            }
        ];
        chart.update();
    }

    window.onload = function() { initChart(); calc(); };
</script>
</body>
</html>
