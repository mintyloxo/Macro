<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Mundell-Fleming: Tipo de Cambio Fijo</title>
    <!-- Cargamos Chart.js desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 10px; }
        h2 { font-size: 1.2rem; color: #7f8c8d; text-align: center; margin-top: 0; }
        
        /* Panel de Resultados */
        .results-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; background: #e8f6f3; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 5px solid #1abc9c; }
        .result-item { text-align: center; }
        .result-label { font-size: 0.85rem; color: #555; font-weight: bold; }
        .result-value { font-size: 1.4rem; color: #16a085; font-weight: bold; }

        /* Controles Principales */
        .controls-main { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .control-group { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #dee2e6; }
        .control-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #2c3e50; }
        .slider-container { display: flex; align-items: center; gap: 10px; }
        input[type=range] { flex-grow: 1; cursor: pointer; }
        .val-display { min-width: 40px; text-align: right; font-family: monospace; font-weight: bold; color: #e74c3c; }

        /* Parámetros Estructurales (Oculto por defecto) */
        #advanced-params { display: none; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; background: #fff3cd; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ffeeba; }
        #advanced-params.show { display: grid; animation: fadeIn 0.3s; }
        .btn-toggle { background: #f39c12; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 15px; display: inline-block; }
        .btn-toggle:hover { background: #d35400; }

        /* Gráfico */
        .chart-container { position: relative; height: 450px; width: 100%; background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 10px; }
        
        /* Explicación */
        .explanation { margin-top: 20px; padding: 15px; background: #d6eaf8; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; }
        .explanation strong { color: #2980b9; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h1>Mundell-Fleming: Tipo de Cambio Fijo</h1>
    <h2>La política monetaria es endógena para mantener E constante</h2>

    <!-- Botón para parámetros avanzados -->
    <button class="btn-toggle" onclick="toggleParams()">⚙️ Parámetros Estructurales</button>

    <!-- Parámetros Estructurales (Ocultos) -->
    <div id="advanced-params">
        <div class="control-group">
            <label>c₁ (Propensión a consumir)</label>
            <div class="slider-container">
                <input type="range" id="c1" min="0.1" max="0.9" step="0.05" value="0.75" oninput="updateModel()">
                <span class="val-display" id="val-c1">0.75</span>
            </div>
        </div>
        <div class="control-group">
            <label>m₁ (Propensión a importar)</label>
            <div class="slider-container">
                <input type="range" id="m1" min="0.05" max="0.5" step="0.05" value="0.15" oninput="updateModel()">
                <span class="val-display" id="val-m1">0.15</span>
            </div>
        </div>
        <div class="control-group">
            <label>b (Sensibilidad Inversión a r)</label>
            <div class="slider-container">
                <input type="range" id="b" min="0.5" max="10" step="0.5" value="2.0" oninput="updateModel()">
                <span class="val-display" id="val-b">2.0</span>
            </div>
        </div>
        <div class="control-group">
            <label>h (Sensibilidad Dinero a r)</label>
            <div class="slider-container">
                <input type="range" id="h" min="0.5" max="10" step="0.5" value="2.0" oninput="updateModel()">
                <span class="val-display" id="val-h">2.0</span>
            </div>
        </div>
        <div class="control-group">
            <label>k (Sensibilidad Dinero a Y)</label>
            <div class="slider-container">
                <input type="range" id="k" min="0.1" max="1.0" step="0.05" value="0.50" oninput="updateModel()">
                <span class="val-display" id="val-k">0.50</span>
            </div>
        </div>
        <div class="control-group">
            <label>x₁ (Sensibilidad Exportaciones a E)</label>
            <div class="slider-container">
                <input type="range" id="x1" min="0.1" max="5.0" step="0.1" value="1.5" oninput="updateModel()">
                <span class="val-display" id="val-x1">1.5</span>
            </div>
        </div>
    </div>

    <!-- Resultados -->
    <div class="results-box">
        <div class="result-item">
            <div class="result-label">Ingreso (Y)</div>
            <div class="result-value" id="res-Y">0</div>
        </div>
        <div class="result-item">
            <div class="result-label">Tasa Interés (r)</div>
            <div class="result-value" id="res-r">0%</div>
        </div>
        <div class="result-item">
            <div class="result-label">Oferta Monetaria (M)</div>
            <div class="result-value" id="res-M">0</div>
        </div>
        <div class="result-item">
            <div class="result-label">Multiplicador (k)</div>
            <div class="result-value" id="res-k">0</div>
        </div>
        <div class="result-item">
            <div class="result-label">Balanza Comercial (NX)</div>
            <div class="result-value" id="res-NX">0</div>
        </div>
    </div>

    <!-- Controles de Política -->
    <div class="controls-main">
        <div class="control-group">
            <label>Gasto Público (G)</label>
            <div class="slider-container">
                <input type="range" id="G" min="0" max="100" value="20" oninput="updateModel()">
                <span class="val-display" id="val-G">20</span>
            </div>
        </div>
        <div class="control-group">
            <label>Impuestos (T)</label>
            <div class="slider-container">
                <input type="range" id="T" min="0" max="100" value="20" oninput="updateModel()">
                <span class="val-display" id="val-T">20</span>
            </div>
        </div>
        <div class="control-group">
            <label>Tipo de Cambio Fijo (E)</label>
            <div class="slider-container">
                <input type="range" id="E" min="1" max="20" step="0.5" value="10" oninput="updateModel()">
                <span class="val-display" id="val-E">10</span>
            </div>
        </div>
        <div class="control-group">
            <label>Tasa Mundial (r*)</label>
            <div class="slider-container">
                <input type="range" id="rStar" min="0" max="15" step="0.5" value="5" oninput="updateModel()">
                <span class="val-display" id="val-rStar">5%</span>
            </div>
        </div>
    </div>

    <!-- Gráfico -->
    <div class="chart-container">
        <canvas id="mfChart"></canvas>
    </div>

    <!-- Explicación -->
    <div class="explanation" id="explanation-text">
        Calculando equilibrio...
    </div>
</div>

<script>
    // Variables globales
    let chartInstance = null;

    // Función para mostrar/ocultar parámetros
    function toggleParams() {
        const panel = document.getElementById('advanced-params');
        panel.classList.toggle('show');
    }

    // Función principal de actualización
    function updateModel() {
        // 1. Obtener valores de los sliders (Política)
        const G = parseFloat(document.getElementById('G').value);
        const T = parseFloat(document.getElementById('T').value);
        const E = parseFloat(document.getElementById('E').value);
        const rStar = parseFloat(document.getElementById('rStar').value);

        // Actualizar etiquetas visuales
        document.getElementById('val-G').textContent = G;
        document.getElementById('val-T').textContent = T;
        document.getElementById('val-E').textContent = E;
        document.getElementById('val-rStar').textContent = rStar + '%';

        // 2. Obtener parámetros estructurales
        const c1 = parseFloat(document.getElementById('c1').value);
        const m1 = parseFloat(document.getElementById('m1').value);
        const b = parseFloat(document.getElementById('b').value);
        const h = parseFloat(document.getElementById('h').value);
        const k = parseFloat(document.getElementById('k').value);
        const x1 = parseFloat(document.getElementById('x1').value);

        // Actualizar etiquetas estructurales
        document.getElementById('val-c1').textContent = c1;
        document.getElementById('val-m1').textContent = m1;
        document.getElementById('val-b').textContent = b;
        document.getElementById('val-h').textContent = h;
        document.getElementById('val-k').textContent = k;
        document.getElementById('val-x1').textContent = x1;

        // 3. Constantes autónomas (simplificadas como en el código base)
        const c0 = 10; 
        const I0 = 10;
        const NX0 = 0;
        const M0 = 10; // Componente autónomo de demanda de dinero si existiera, usualmente 0 en forma simple

        // 4. CÁLCULOS DE EQUILIBRIO (Tipo de Cambio Fijo)
        // En E fijo: r = r*
        const r = rStar;
        
        // Multiplicador de la economía abierta
        // k_mult = 1 / (1 - c1 + m1)
        const multiplier = 1 / (1 - c1 + m1);

        // Gasto Autónomo Total (A)
        // A = c0 - c1*T + I0 - b*r + G + NX0 + x1*E
        // Nota: Para calcular Y de equilibrio, usamos la condición IS donde r=r*
        const A_autonomo = c0 - (c1 * T) + I0 + G + NX0 + (x1 * E);
        
        // Equilibrio Y (IS con r=r*)
        // Y = multiplier * (A_sin_interes + ... ) 
        // La fórmula completa derivada de IS: Y = (A_autonomo - b*r) * multiplier? 
        // Revisemos: Y = c0 + c1(Y-T) + I0 - b*r + G + NX0 + x1*E - m1*Y
        // Y(1 - c1 + m1) = c0 - c1T + I0 - b*r + G + NX0 + x1*E
        // Y = [ (c0 - c1T + I0 + G + NX0 + x1*E) - b*r ] / (1 - c1 + m1)
        
        const numerator = (c0 - (c1 * T) + I0 + G + NX0 + (x1 * E)) - (b * r);
        const Y = numerator / (1 - c1 + m1);

        // Equilibrio M (LM despejada para M, ya que r e Y están dados)
        // LM: M/P = kY - h*r  (Asumimos P=1)
        const M_eq = (k * Y) - (h * r);

        // Balanza Comercial NX
        // NX = NX0 + x1*E - m1*Y
        const NX = NX0 + (x1 * E) - (m1 * Y);

        // 5. Mostrar Resultados
        document.getElementById('res-Y').textContent = Y.toFixed(2);
        document.getElementById('res-r').textContent = r.toFixed(2) + '%';
        document.getElementById('res-M').textContent = M_eq.toFixed(2);
        document.getElementById('res-k').textContent = multiplier.toFixed(2);
        document.getElementById('res-NX').textContent = NX.toFixed(2);

        // Texto explicativo
        let msg = `<strong>Equilibrio alcanzado:</strong> Con r = r* (${r}%), el ingreso de equilibrio es Y=${Y.toFixed(2)}. `;
        if (NX > 0) msg += `Hay <strong>superávit comercial</strong>. El Banco Central debe comprar divisas, aumentando M hasta ${M_eq.toFixed(2)} para mantener E fijo.`;
        else if (NX < 0) msg += `Hay <strong>déficit comercial</strong>. El Banco Central vende reservas, reduciendo M hasta ${M_eq.toFixed(2)} para mantener E fijo.`;
        else msg += `La balanza comercial está equilibrada.`;
        document.getElementById('explanation-text').innerHTML = msg;

        // 6. GENERAR DATOS PARA LAS CURVAS (Punto por punto como el código base)
        generateChartData(Y, r, c1, m1, b, h, k, x1, c0, I0, G, T, E, NX0);
    }

    function generateChartData(Y_eq, r_eq, c1, m1, b, h, k, x1, c0, I0, G, T, E, NX0) {
        const rStar = r_eq; // En este modelo r es fijo por la BP
        
        // Rango de Y para graficar (desde 0 hasta un poco más del equilibrio)
        const maxY = Math.max(200, Y_eq * 1.5);
        const step = maxY / 50;
        
        const dataIS = [];
        const dataLM = [];
        const dataBP = [];

        for (let y = 0; y <= maxY; y += step) {
            // Curva IS: Despejamos r de la ecuación IS
            // Y = (A_autonomo_part - b*r) / (1-c1+m1)  =>  r = (A_part - Y(1-c1+m1)) / b
            const A_part = c0 - (c1 * T) + I0 + G + NX0 + (x1 * E);
            const r_is = (A_part - y * (1 - c1 + m1)) / b;
            if (r_is >= 0) dataIS.push({x: y, y: r_is});

            // Curva LM: Despejamos r de la ecuación LM usando M_endógeno calculado
            // M_eq = k*Y - h*r  =>  r = (k*Y - M_eq) / h
            const M_current = (k * Y_eq) - (h * r_eq); // Usamos el M de equilibrio actual
            const r_lm = ((k * y) - M_current) / h;
            if (r_lm >= 0 && r_lm <= 20) dataLM.push({x: y, y: r_lm});

            // Curva BP: Horizontal en r* (Movilidad perfecta de capitales)
            dataBP.push({x: y, y: rStar});
        }

        renderChart(dataIS, dataLM, dataBP, Y_eq, r_eq);
    }

    function renderChart(dataIS, dataLM, dataBP, Y_eq, r_eq) {
        const ctx = document.getElementById('mfChart').getContext('2d');

        if (chartInstance) {
            chartInstance.destroy();
        }

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: [
                    {
                        label: 'Curva IS',
                        data: dataIS,
                        borderColor: '#e74c3c', // Rojo
                        backgroundColor: 'rgba(231, 76, 60, 0.1)',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: false,
                        tension: 0.4
                    },
                    {
                        label: 'Curva LM',
                        data: dataLM,
                        borderColor: '#3498db', // Azul
                        backgroundColor: 'rgba(52, 152, 219, 0.1)',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: false,
                        tension: 0.4
                    },
                    {
                        label: 'Curva BP (r*)',
                        data: dataBP,
                        borderColor: '#2ecc71', // Verde
                        borderWidth: 2,
                        borderDash: [5, 5],
                        pointRadius: 0,
                        fill: false
                    },
                    {
                        label: 'Equilibrio',
                        data: [{x: Y_eq, y: r_eq}],
                        pointRadius: 6,
                        pointBackgroundColor: '#000',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        showLine: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        type: 'linear',
                        position: 'bottom',
                        title: { display: true, text: 'Ingreso (Y)' },
                        min: 0,
                        grid: { color: '#eee' }
                    },
                    y: {
                        title: { display: true, text: 'Tasa de Interés (r)' },
                        min: 0,
                        max: 20,
                        grid: { color: '#eee' }
                    }
                },
                plugins: {
                    tooltip: {
                        mode: 'index',
                        intersect: false
                    },
                    legend: {
                        position: 'top'
                    }
                }
            }
        });
    }

    // INICIALIZACIÓN AL CARGAR LA PÁGINA
    document.addEventListener('DOMContentLoaded', function() {
        // Ejecutar cálculo inicial para que no aparezca vacío
        updateModel();
    });

</script>

</body>
</html>
