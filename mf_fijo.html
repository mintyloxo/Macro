<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MF Tipo de Cambio Fijo</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; font-style: italic; }
        
        /* Panel de Parámetros Estructurales */
        .params-panel {
            background: #eef2f7;
            border: 1px solid #bdc3c7;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .params-header {
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #2980b9;
        }
        .params-grid {
            display: none; /* Oculto por defecto */
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ccc;
        }
        .params-grid.active { display: grid; }
        
        /* Controles Principales */
        .controls-main {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
            background: #fff;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 8px;
        }
        .control-group { display: flex; flex-direction: column; }
        .control-group label { font-weight: 600; margin-bottom: 5px; font-size: 0.9em; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .val-display { float: right; color: #e74c3c; font-weight: bold; }

        /* Resultados */
        .results-box {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 25px;
            background: #2c3e50;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .res-item strong { display: block; font-size: 0.8em; opacity: 0.8; }
        .res-item span { font-size: 1.4em; font-weight: bold; color: #f1c40f; }

        /* Gráfico */
        .chart-wrapper { position: relative; height: 450px; width: 100%; }
        
        .explanation {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border-left: 5px solid #ffc107;
            border-radius: 4px;
            font-size: 0.95em;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Mundell-Fleming: Tipo de Cambio Fijo</h1>
    <div class="subtitle">El Banco Central ajusta M para mantener E y r = r*</div>

    <!-- Parámetros Estructurales (Estilo Base Code) -->
    <div class="params-panel">
        <div class="params-header" onclick="toggleParams()">
            <span>⚙️ Parámetros Estructurales (Click para editar)</span>
            <span id="arrow">▼</span>
        </div>
        <div class="params-grid" id="structParams">
            <div class="control-group">
                <label>c₁ (Prop. Consumir): <span id="val-c1" class="val-display">0.75</span></label>
                <input type="range" id="c1" min="0.1" max="0.9" step="0.05" value="0.75" oninput="updateModel()">
            </div>
            <div class="control-group">
                <label>m₁ (Prop. Importar): <span id="val-m1" class="val-display">0.15</span></label>
                <input type="range" id="m1" min="0.05" max="0.5" step="0.05" value="0.15" oninput="updateModel()">
            </div>
            <div class="control-group">
                <label>b (Sens. Inversión): <span id="val-b" class="val-display">2.0</span></label>
                <input type="range" id="b" min="0.5" max="10" step="0.5" value="2.0" oninput="updateModel()">
            </div>
            <div class="control-group">
                <label>h (Sens. Dinero a r): <span id="val-h" class="val-display">2.0</span></label>
                <input type="range" id="h" min="0.5" max="10" step="0.5" value="2.0" oninput="updateModel()">
            </div>
            <div class="control-group">
                <label>k (Sens. Dinero a Y): <span id="val-k" class="val-display">0.5</span></label>
                <input type="range" id="k" min="0.1" max="1.0" step="0.05" value="0.5" oninput="updateModel()">
            </div>
            <div class="control-group">
                <label>x₁ (Sens. Export.): <span id="val-x1" class="val-display">1.5</span></label>
                <input type="range" id="x1" min="0.1" max="5.0" step="0.1" value="1.5" oninput="updateModel()">
            </div>
        </div>
    </div>

    <!-- Controles de Política -->
    <div class="controls-main">
        <div class="control-group">
            <label>Gasto Público (G): <span id="val-G" class="val-display">20</span></label>
            <input type="range" id="G" min="0" max="100" value="20" oninput="updateModel()">
        </div>
        <div class="control-group">
            <label>Impuestos (T): <span id="val-T" class="val-display">20</span></label>
            <input type="range" id="T" min="0" max="100" value="20" oninput="updateModel()">
        </div>
        <div class="control-group">
            <label>Tipo de Cambio (E): <span id="val-E" class="val-display">10</span></label>
            <input type="range" id="E" min="1" max="50" value="10" oninput="updateModel()">
        </div>
        <div class="control-group">
            <label>Tasa Interés Mundial (r*): <span id="val-rstar" class="val-display">5</span>%</label>
            <input type="range" id="rstar" min="1" max="20" value="5" oninput="updateModel()">
        </div>
    </div>

    <!-- Resultados -->
    <div class="results-box">
        <div class="res-item"><strong>Ingreso (Y)</strong><span id="res-Y">0</span></div>
        <div class="res-item"><strong>Tasa Interés (r)</strong><span id="res-r">0</span>%</div>
        <div class="res-item"><strong>Mult. Keynesiano</strong><span id="res-mult">0</span></div>
        <div class="res-item"><strong>Oferta Monetaria (M)</strong><span id="res-M">0</span></div>
        <div class="res-item"><strong>Balanza (NX)</strong><span id="res-NX">0</span></div>
    </div>

    <!-- Gráfico -->
    <div class="chart-wrapper">
        <canvas id="mfChart"></canvas>
    </div>

    <div class="explanation" id="exp-text">
        Ajustando parámetros...
    </div>
</div>

<script>
    // Variables Globales
    let chartInstance = null;

    // Inicializar
    window.onload = function() {
        updateModel();
    };

    function toggleParams() {
        const grid = document.getElementById('structParams');
        const arrow = document.getElementById('arrow');
        if (grid.classList.contains('active')) {
            grid.classList.remove('active');
            arrow.innerHTML = '▼';
        } else {
            grid.classList.add('active');
            arrow.innerHTML = '▲';
        }
    }

    function updateModel() {
        // 1. Leer Parámetros Estructurales
        const c1 = parseFloat(document.getElementById('c1').value);
        const m1 = parseFloat(document.getElementById('m1').value);
        const b = parseFloat(document.getElementById('b').value);
        const h = parseFloat(document.getElementById('h').value);
        const k = parseFloat(document.getElementById('k').value);
        const x1 = parseFloat(document.getElementById('x1').value);

        // Actualizar etiquetas visuales
        document.getElementById('val-c1').innerText = c1;
        document.getElementById('val-m1').innerText = m1;
        document.getElementById('val-b').innerText = b;
        document.getElementById('val-h').innerText = h;
        document.getElementById('val-k').innerText = k;
        document.getElementById('val-x1').innerText = x1;

        // 2. Leer Variables de Política
        const G = parseFloat(document.getElementById('G').value);
        const T = parseFloat(document.getElementById('T').value);
        const E = parseFloat(document.getElementById('E').value);
        const r_star = parseFloat(document.getElementById('rstar').value);

        document.getElementById('val-G').innerText = G;
        document.getElementById('val-T').innerText = T;
        document.getElementById('val-E').innerText = E;
        document.getElementById('val-rstar').innerText = r_star;

        // 3. Cálculos Económicos (Lógica Base Code)
        // Constantes exógenas simplificadas (c0, I0, NX0)
        const c0 = 10; 
        const I0 = 10;
        const NX0 = 0;

        // Gasto Autónomo (A)
        const A = c0 - c1*T + I0 + G + NX0;

        // Multiplicador de la economía abierta
        const multiplier = 1 / (1 - c1 + m1);

        // EN CAMBIO FIJO: r = r*
        const r = r_star;

        // Equilibrio IS (Y) dado r=r*
        // Y = multiplier * (A + x1*E - b*r)
        const Y = multiplier * (A + x1*E - b*r);

        // Equilibrio LM (M endógeno)
        // M/P = kY - hr  (asumiendo P=1)
        const M = k*Y - h*r;

        // Balanza Comercial (NX)
        const NX = NX0 + x1*E - m1*Y;

        // 4. Mostrar Resultados
        document.getElementById('res-Y').innerText = Y.toFixed(2);
        document.getElementById('res-r').innerText = r.toFixed(2);
        document.getElementById('res-mult').innerText = multiplier.toFixed(2);
        document.getElementById('res-M').innerText = M.toFixed(2);
        document.getElementById('res-NX').innerText = NX.toFixed(2);

        // Texto explicativo
        let msg = "";
        if (NX > 0) msg = "Superávit comercial. El BC compra divisas, aumentando M automáticamente.";
        else if (NX < 0) msg = "Déficit comercial. El BC vende reservas, reduciendo M automáticamente.";
        else msg = "Equilibrio externo perfecto.";
        document.getElementById('exp-text').innerText = `Con r=${r}% fijo, el ingreso de equilibrio es Y=${Y.toFixed(1)}. Para mantener este equilibrio, la Oferta Monetaria debe ser M=${M.toFixed(1)}. ${msg}`;

        // 5. Generar Datos para Gráficas (Estilo Base Code: bucle for)
        const maxY = Y * 1.5; // Rango dinámico
        const step = maxY / 20;
        
        let dataIS = [];
        let dataLM = [];
        let dataBP = [];

        // Curva IS: r = (A + x1*E - (1-c1+m1)Y) / b
        for (let y = 0; y <= maxY; y += step) {
            let r_is = (A + x1*E - (1 - c1 + m1)*y) / b;
            if (r_is >= 0) dataIS.push({x: y, y: r_is});
        }

        // Curva LM: r = (kY - M) / h  (Usando la M calculada endógenamente para que pase por el equilibrio)
        // Nota: En cambio fijo, graficamos la LM que corresponde al M de equilibrio actual
        for (let y = 0; y <= maxY; y += step) {
            let r_lm = (k*y - M) / h;
            if (r_lm >= 0) dataLM.push({x: y, y: r_lm});
        }

        // Curva BP: r = r* (Horizontal)
        dataBP = [{x: 0, y: r_star}, {x: maxY, y: r_star}];

        // 6. Dibujar Gráfico
        drawChart(dataIS, dataLM, dataBP, Y, r_star);
    }

    function drawChart(isData, lmData, bpData, eqY, eqR) {
        const ctx = document.getElementById('mfChart').getContext('2d');

        if (chartInstance) {
            chartInstance.destroy();
        }

        chartInstance = new Chart(ctx, {
            type: 'scatter',
             {
                datasets: [
                    {
                        label: 'Curva IS',
                         isData,
                        borderColor: '#e74c3c', // Rojo
                        backgroundColor: '#e74c3c',
                        showLine: true,
                        borderWidth: 2,
                        pointRadius: 0
                    },
                    {
                        label: 'Curva LM',
                         lmData,
                        borderColor: '#3498db', // Azul
                        backgroundColor: '#3498db',
                        showLine: true,
                        borderWidth: 2,
                        pointRadius: 0
                    },
                    {
                        label: 'Curva BP (r*)',
                         bpData,
                        borderColor: '#2ecc71', // Verde
                        backgroundColor: '#2ecc71',
                        showLine: true,
                        borderWidth: 2,
                        borderDash: [5, 5],
                        pointRadius: 0
                    },
                    {
                        label: 'Equilibrio',
                         [{x: eqY, y: eqR}],
                        backgroundColor: '#f1c40f', // Amarillo
                        pointRadius: 6,
                        showLine: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        type: 'linear',
                        position: 'bottom',
                        title: { display: true, text: 'Ingreso (Y)', font: {size: 14} },
                        min: 0,
                        suggestedMax: eqY * 1.2
                    },
                    y: {
                        title: { display: true, text: 'Tasa de Interés (r)', font: {size: 14} },
                        min: 0,
                        suggestedMax: eqR * 1.5 + 5
                    }
                },
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return context.dataset.label + ': (' + context.parsed.x.toFixed(1) + ', ' + context.parsed.y.toFixed(1) + ')';
                            }
                        }
                    }
                }
            }
        });
    }
</script>

</body>
</html>
