<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Condición Marshall-Lerner</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 20px auto; padding: 20px; background: #f4f6f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #8e44ad; border-bottom: 2px solid #9b59b6; padding-bottom: 10px; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .control-group { background: #f5eef8; padding: 15px; border-radius: 5px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type=range] { width: 100%; }
        .status { font-size: 1.2em; font-weight: bold; text-align: center; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
        .ok { background: #d4efdf; color: #196f3d; }
        .fail { background: #fadbd8; color: #943126; }
        canvas { max-height: 350px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Condición Marshall-Lerner</h2>
    <p>¿Una depreciación mejora la balanza comercial? Depende de las elasticidades.</p>
    
    <div class="controls">
        <div class="control-group">
            <label>Elasticidad Exportaciones (ηX): <span id="val-ex">1.0</span></label>
            <input type="range" id="ex" min="0" max="3" step="0.1" value="1.0" oninput="calc()">
        </div>
        <div class="control-group">
            <label>Elasticidad Importaciones (ηM): <span id="val-im">0.5</span></label>
            <input type="range" id="im" min="0" max="3" step="0.1" value="0.5" oninput="calc()">
        </div>
    </div>

    <div id="status-box" class="status fail">NO SE CUMPLE (Suma < 1)</div>

    <canvas id="chartML"></canvas>
    <p style="text-align:center; margin-top:10px;">Eje X: Tipo de Cambio (E) | Eje Y: Balanza Comercial (NX)</p>
</div>

<script>
    let chart;

    function initChart() {
        const ctx = document.getElementById('chartML').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: { datasets: [] },
            options: {
                responsive: true,
                scales: {
                    x: { title: {display: true, text: 'Tipo de Cambio (E)'}, min: 0.5, max: 2.0 },
                    y: { title: {display: true, text: 'Balanza (NX)'}, min: -50, max: 50 }
                }
            }
        });
    }

    function calc() {
        const ex = parseFloat(document.getElementById('ex').value);
        const im = parseFloat(document.getElementById('im').value);
        
        document.getElementById('val-ex').innerText = ex;
        document.getElementById('val-im').innerText = im;

        const sum = ex + im;
        const box = document.getElementById('status-box');
        
        if (sum > 1) {
            box.className = "status ok";
            box.innerText = "SE CUMPLE: Una depreciación mejora la balanza a largo plazo.";
        } else {
            box.className = "status fail";
            box.innerText = "NO SE CUMPLE: Una depreciación empeora la balanza (Curva J pronunciada).";
        }

        // Generar curva NX vs E
        // NX = X(E) - M(E)/E  (Simplificado para demostración)
        // Asumimos X = E^ex, M = E^(-im) * constante
        const points = [];
        for (let e = 0.5; e <= 2.0; e += 0.1) {
            // Función simplificada de NX
            // Si ex+im > 1, la pendiente es positiva
            const nx = 10 * (Math.pow(e, ex) - Math.pow(e, 1-im)); 
            points.push({x: e, y: nx});
        }

        chart.data.datasets = [{
            label: 'Balanza Comercial (NX)',
            data: points,
            borderColor: sum > 1 ? '#27ae60' : '#c0392b',
            borderWidth: 3,
            fill: false,
            pointRadius: 0
        }];
        chart.update();
    }

    window.onload = function() { initChart(); calc(); };
</script>
</body>
</html>
